<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#071521"/><text x="60" y="74" fill="#eef7ff" font-family="Arial" font-size="31" font-weight="700">ADAPTIVE VOLUMETRIC LIGHT-FIELD SYNTHESIS</text><text x="60" y="112" fill="#7fbcd2" font-family="Arial" font-size="18">One quantized phase map · multiple focal depths · explicit optical tradeoffs</text><rect x="74" y="236" width="238" height="238" rx="24" fill="#102b3b" stroke="#54d4d8" stroke-width="3"/><path d="M105 354 Q145 255 185 354 T265 354" fill="none" stroke="#77ecdc" stroke-width="9"/><text x="193" y="516" fill="#d8f7f2" font-family="Arial" font-size="20" text-anchor="middle">Phase-only SLM</text><path d="M332 354 H465" stroke="#8cb9cc" stroke-width="5"/><path d="M446 339 L469 354 L446 369" fill="none" stroke="#8cb9cc" stroke-width="5"/><g fill="none" stroke="#8ba4ff" stroke-width="5"><path d="M488 190 Q650 354 488 518"/><path d="M545 190 Q710 354 545 518"/></g><g font-family="Arial" text-anchor="middle"><rect x="710" y="150" width="390" height="128" rx="18" fill="#14223b" stroke="#8ba4ff"/><text x="905" y="208" fill="#eef3ff" font-size="23">Near focal plane</text><text x="905" y="244" fill="#9eace9" font-size="17">error · efficiency · speckle</text><rect x="710" y="310" width="390" height="128" rx="18" fill="#14223b" stroke="#d7a6ff"/><text x="905" y="368" fill="#eef3ff" font-size="23">Middle focal plane</text><text x="905" y="404" fill="#c6a4df" font-size="17">adaptive loss weight</text><rect x="710" y="470" width="390" height="128" rx="18" fill="#14223b" stroke="#54d4d8"/><text x="905" y="528" fill="#eef3ff" font-size="23">Far focal plane</text><text x="905" y="564" fill="#8fd8d5" font-size="17">crosstalk · quantization</text></g><path d="M1095 627 C960 704 300 700 192 505" fill="none" stroke="#f2c66d" stroke-width="3" stroke-dasharray="11 10"/><text x="655" y="684" fill="#f2c66d" font-family="Arial" font-size="18" text-anchor="middle">harder planes receive more weight in the next iteration</text></svg>
