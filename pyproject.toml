[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-volumetric-light-field-synthesis"
version = "0.1.0"
description = "Multi-depth phase-only hologram optimization with adaptive plane weighting and optical quality diagnostics."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
